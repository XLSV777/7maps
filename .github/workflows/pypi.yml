# Publish one Python package to PyPI with Trusted Publishing (OIDC). No token is stored anywhere: PyPI trusts this
# file (.github/workflows/pypi.yml in XLSV777/7maps) plus the per-package GitHub environment below.
# Started by hand or by scripts/release.mjs in 7IT-LANDING:  node scripts/release.mjs pypi <key>
# The build job has no publish rights; only the publish job gets id-token: write, inside the package's environment.
# Supply chain: every action is pinned to a full commit SHA (the tag is in the comment), build and twine are exact.
name: publish to PyPI

on:
  workflow_dispatch:
    inputs:
      package:
        description: PyPI project to publish
        required: true
        type: choice
        options:
          - sevenmaps-guard
          - sevenmaps-sensor
          - sevenmaps-sensor-litellm
          - sevenmaps-sensor-contextforge
      version:
        description: Version to publish (must equal the version in the package's pyproject.toml)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.package }}
  cancel-in-progress: false

env:
  # PyPI project name -> folder in this repo
  PKG_DIR: ${{ fromJSON('{"sevenmaps-guard":"packages/guard-py","sevenmaps-sensor":"packages/sensor-py","sevenmaps-sensor-litellm":"packages/sensor-litellm","sevenmaps-sensor-contextforge":"packages/sensor-contextforge"}')[inputs.package] }}

jobs:
  build:
    name: build ${{ inputs.package }} ${{ inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.8'
      - name: Tools
        run: python -m pip install --disable-pip-version-check build==1.6.1 twine==7.0.0
      - name: Name and version match the input
        working-directory: ${{ env.PKG_DIR }}
        env:
          WANT_NAME: ${{ inputs.package }}
          WANT_VERSION: ${{ inputs.version }}
        run: |
          python - <<'EOF'
          import os, sys, tomllib
          p = tomllib.load(open("pyproject.toml", "rb"))["project"]
          if p["name"] != os.environ["WANT_NAME"] or p["version"] != os.environ["WANT_VERSION"]:
              sys.exit(f"pyproject.toml says {p['name']} {p['version']}, the input says {os.environ['WANT_NAME']} {os.environ['WANT_VERSION']}")
          bad = [d for d in p.get("dependencies", []) if " @ " in d or "://" in d]
          if bad:
              sys.exit(f"PyPI refuses direct URL dependencies: {bad}")
          print("ok", p["name"], p["version"])
          EOF
      - name: Tests (guard-py calls the live server, so it is compiled only, as in ci.yml)
        working-directory: ${{ env.PKG_DIR }}
        run: |
          if [ "${{ inputs.package }}" = "sevenmaps-guard" ]; then
            python -m py_compile sevenmaps_guard/__init__.py
          else
            python -m unittest discover -s tests -v
          fi
      - name: Build
        run: python -m build --outdir dist "$PKG_DIR"
      - name: Check
        run: |
          python -m twine check --strict dist/*
          python - <<'EOF'
          import glob, sys, zipfile
          bad = []
          for w in glob.glob("dist/*.whl"):
              for n in zipfile.ZipFile(w).namelist():
                  print("  wheel:", n)
                  if n.startswith("tests/") or "/tests/" in n or ".env" in n or n.endswith((".pem", ".key", ".pyc")):
                      bad.append(n)
          if bad:
              sys.exit(f"the wheel carries files that must not ship: {bad}")
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish ${{ inputs.package }} ${{ inputs.version }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One environment per PyPI project: PyPI refuses the same owner/repo/workflow/environment for two pending publishers.
    environment:
      name: ${{ fromJSON('{"sevenmaps-guard":"pypi","sevenmaps-sensor":"pypi-sensor","sevenmaps-sensor-litellm":"pypi-sensor-litellm","sevenmaps-sensor-contextforge":"pypi-sensor-contextforge"}')[inputs.package] }}
      url: https://pypi.org/project/${{ inputs.package }}/${{ inputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (Trusted Publishing; attestations are on by default)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
