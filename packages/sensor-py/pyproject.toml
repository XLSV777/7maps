[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sevenmaps-sensor"
version = "0.1.0"
description = "Opt-in sensor for MCP gateways and clients: reports per-call outcomes (server, ok, fail reason, ms, tool name) to 7Maps. Never arguments or results."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "7IT", email = "lior@7it.co.il" }]
keywords = ["mcp", "model-context-protocol", "gateway", "telemetry", "7maps"]
dependencies = []

[project.urls]
Homepage = "https://7it.co.il/7maps/"
Source = "https://github.com/XLSV777/7maps/tree/main/packages/sensor-py"

[tool.setuptools]
packages = ["sevenmaps_sensor"]
