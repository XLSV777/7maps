[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sevenmaps-sensor-contextforge"
version = "0.1.0"
description = "7Maps sensor for IBM ContextForge (a cpex plugin). Opt-in; sends per-call outcomes only."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "7IT", email = "lior@7it.co.il" }]
dependencies = ["sevenmaps-sensor @ git+https://github.com/XLSV777/7maps@7b0e5eab08eb7b3eb3d77971601f77177c7c1d24#subdirectory=packages/sensor-py"]

[project.urls]
Homepage = "https://7it.co.il/7maps/"
Source = "https://github.com/XLSV777/7maps/tree/main/packages/sensor-contextforge"

[tool.setuptools]
packages = ["sevenmaps_sensor_contextforge"]
